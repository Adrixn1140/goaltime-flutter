# El template de Flutter trae -Xmx8G, y eso no cabe en un equipo con menos de 8 GB de RAM:
# el JVM crece hasta que el OOM-killer del kernel lo mata. Este es el valor con el que se ha
# comprobado que el APK construye en una máquina de 3.7 GB. Súbelo si tienes memoria de
# sobra; el detalle está en docs/ENTORNO.md.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Por defecto Gradle lanza un daemon de Kotlin aparte, o sea un segundo JVM. En un equipo
# de 3.7 GB, con el heap de arriba, los dos no caben a la vez y el build falla con
# "Failed connecting to the daemon in 4 retries" sin llegar a compilar. Con "in-process"
# el compilador de Kotlin corre dentro del propio Gradle: un JVM menos, y el build
# completa en la RAM que ya está ajustada arriba.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
