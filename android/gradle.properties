# El template de Flutter trae -Xmx8G, y eso no cabe en un equipo con menos de 8 GB de RAM:
# el JVM crece hasta que el OOM-killer del kernel lo mata. Este es el valor con el que se ha
# comprobado que el APK construye en una máquina de 3.7 GB. Súbelo si tienes memoria de
# sobra; el detalle está en docs/ENTORNO.md.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
