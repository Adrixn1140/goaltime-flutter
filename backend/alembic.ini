# Configuración de Alembic (spec.md 7.1).
#
# La URL **no** está aquí: la lee `migrations/env.py` de `DATABASE_URL`, que es la
# variable de entorno que ya usa el resto de la aplicación. Ponerla en este archivo
# significaría tener dos lugares que dicen dónde está la base, y el que se olvide de
# actualizar es el que se lleva por delante una migración en producción.
#
# Uso habitual:  alembic upgrade head · alembic check · alembic revision --autogenerate
[alembic]
script_location = migrations
prepend_sys_path = .
# `sqlalchemy.url` lo sobrescribe env.py con el valor de DATABASE_URL.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
